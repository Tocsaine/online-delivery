<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фастфуд 24 - Доставка</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<script src="/static/js/cart.js"></script>
<body>
<header class="site-header">
    <div class="container">
        <h1>🍔 Фастфуд 24</h1>
        <nav>
            <a href="{% url 'catalog:menu' %}">Меню</a>
            <a href="{% url 'cart:view' %}" class="cart-link">
                Корзина (<span id="cart-count">{{ cart_count|default:0 }}</span>)
            </a>
        </nav>
    </div>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="site-footer">
    <div class="container">
        <p>© 2026 Фастфуд 24. Доставка работает круглосуточно.</p>
    </div>
</footer>
</body>
</html>
