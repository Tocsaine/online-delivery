{% extends 'catalog/base.html' %}
{% block content %}
    <div class="container cart-page">
        <h2 class="cart-title">📦 Оформление заказа</h2>

        <div class="checkout-grid">
            <form method="post" class="auth-form" style="margin: 0; width: 100%;">
                {% csrf_token %}

                <div class="form-group">
                    <label for="name">Ваше имя</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Иван Иванов" required>
                </div>

                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="+7 (999) 000-00-00"
                           required>
                </div>

                <div class="form-group">
                    <label for="address">Адрес доставки</label>
                    <textarea id="address" name="address" class="form-control" rows="3"
                              placeholder="Улица, дом, квартира, подъезд" required></textarea>
                </div>

                <button type="submit" class="btn-primary">Подтвердить заказ</button>
            </form>

            <div class="cart-summary" style="text-align: left; height: fit-content;">
                <h3 style="margin-bottom: 15px;">Ваш заказ</h3>
                <p style="font-size: 28px; font-weight: 800; margin-bottom: 15px;">{{ total|floatformat:0 }} ₽</p>
                <hr style="border: none; border-top: 1px solid #eee; margin: 15px 0;">
                <p style="font-size: 13px; color: var(--text-muted); line-height: 1.5;">💳 Оплата при получении<br>🚚
                    Доставка 30–45 минут<br>📞 Курьер позвонит за 5 мин до приезда</p>
            </div>
        </div>
    </div>
{% endblock %}
